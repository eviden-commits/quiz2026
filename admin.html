<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>관리자 설정 - 현장 퀴즈 챔피언</title>
<link rel="stylesheet" href="css/style.css?v=3" />
</head>
<body>
<div class="wrap">
  <div class="card wide">
    <h1 class="title" style="font-size:30px;">⚙ 관리자 설정</h1>
    <p class="subtitle">참여형 퀴즈 회차 운영 (문항추가 → 참석자 오픈 → 참석자 클로즈)</p>

    <div class="alert info" id="roundBadge">현재 회차: 없음 · 아래에서 문항을 추가해 새 회차를 시작하세요</div>

    <div class="section-title">1. 문항 추가</div>
    <div id="genAlert" class="alert hidden"></div>
    <div class="grid2">
      <div>
        <label class="field-label">문항 수</label>
        <input type="text" id="genCount" placeholder="예: 10" value="10" />
      </div>
      <div>
        <label class="field-label">카테고리 (선택)</label>
        <select id="genCategory"><option value="">전체</option></select>
      </div>
    </div>
    <button class="btn secondary" id="genBtn">➕ 문항 추가 (새 회차 시작)</button>

    <div class="section-title">2. 참석자 오픈 (참여코드 생성)</div>
    <div id="codeAlert" class="alert hidden"></div>
    <div class="grid2">
      <div>
        <label class="field-label">발급 인원 수</label>
        <input type="text" id="codeCount" placeholder="예: 30" value="30" />
      </div>
      <div>
        <label class="field-label">코드 자릿수</label>
        <input type="text" id="codeDigits" value="4" />
      </div>
    </div>
    <button class="btn" id="openBtn">📥 참석자 오픈</button>
    <textarea id="codesOutput" rows="4" readonly placeholder="생성된 참여코드가 여기에 표시됩니다" style="margin-top:10px;"></textarea>
    <div class="qr-box hidden" id="qrBox">
      <img id="qrImg" alt="QR" />
      <a class="link" id="qrLink" target="_blank"></a>
    </div>

    <div class="section-title">3. 참석자 클로즈</div>
    <div id="closeAlert" class="alert hidden"></div>
    <button class="btn danger" id="closeBtn">🔒 참석자 클로즈 (마감 후 재사용 불가)</button>
    <p class="muted" id="sessionStatus" style="text-align:center; margin-top:10px;"></p>

    <div class="section-title">사전설정 (상품 · 수상자 수 · 시간제한, 선택사항)</div>
    <div id="settingsAlert" class="alert hidden"></div>
    <label class="field-label">퀴즈 제목</label>
    <input type="text" id="setTitle" placeholder="예: 7월 안전퀴즈" />
    <div class="grid2">
      <div>
        <label class="field-label">상품 수</label>
        <input type="text" id="setPrizeCount" value="0" />
      </div>
      <div>
        <label class="field-label">수상자 수</label>
        <input type="text" id="setWinnerCount" value="0" />
      </div>
    </div>
    <label class="field-label">상품명 (쉼표로 구분)</label>
    <input type="text" id="setPrizeNames" placeholder="예: 1등 무선이어폰, 2등 텀블러" />
    <button class="btn ghost" id="saveSettingsBtn">설정 저장</button>
  </div>
</div>

<script src="js/config.js?v=3"></script>
<script src="js/api.js?v=3"></script>
<script src="js/auth.js?v=3"></script>
<script src="js/admin.js?v=3"></script>
</body>
</html>
