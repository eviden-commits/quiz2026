<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>현장 안전퀴즈 챔피언</title>
<link rel="stylesheet" href="css/style.css?v=11" />
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="brandmark">QUIZ CHAMPION</div>
    <h1 class="title">🏆 현장 퀴즈 챔피언</h1>
    <p class="subtitle">참여 방식을 선택하세요</p>

    <div class="mode-grid">
      <div class="mode-card" onclick="location.href='host.html'">
        <span class="emoji">🎤</span>
        <h3>진행자형</h3>
        <p>사회자가 화면을 띄우고<br/>진행하며 정답자를 기록합니다</p>
      </div>
      <div class="mode-card" onclick="location.href='play.html'">
        <span class="emoji">📱</span>
        <h3>참여형</h3>
        <p>참여코드를 입력하고<br/>내 폰으로 직접 풀어요</p>
      </div>
    </div>

    <button class="btn secondary" id="bankLink" style="margin-top:22px;">📚 문제은행</button>

    <div style="margin-top:14px; text-align:center;">
      <a class="link muted" href="admin.html" id="adminLink">⚙ 관리자 설정</a>
    </div>
  </div>
</div>

<script src="js/config.js?v=11"></script>
<script src="js/api.js?v=11"></script>
<script src="js/matrixRain.js?v=11"></script>
<script src="js/auth.js?v=11"></script>
<script>
  function gatedNav(el, target) {
    el.addEventListener('click', function (e) {
      e.preventDefault();
      requireAppLogin('quiz2026_admin_auth').then(function () {
        location.href = target;
      });
    });
  }
  gatedNav(document.getElementById('adminLink'), 'admin.html');
  gatedNav(document.getElementById('bankLink'), 'bank.html');
</script>
</body>
</html>
