<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>진행자 화면 - 현장 퀴즈 챔피언</title>
<link rel="stylesheet" href="css/style.css?v=3" />
</head>
<body>
<div class="wrap">

  <!-- 1. 문항수 선택 화면 -->
  <div class="card" id="screen-setup">
    <h1 class="title">🎤 진행자 화면</h1>
    <p class="subtitle">진행할 문항 수를 선택하세요</p>
    <div id="setup-alert" class="alert error hidden"></div>
    <label class="field-label">문항 수</label>
    <input type="text" id="questionCountInput" placeholder="예: 10" inputmode="numeric" value="10" />
    <button class="btn" id="loadBtn">▶ 진행</button>
  </div>

  <!-- 2. 진행 화면 (좌: 문제, 우: 정답자 입력) -->
  <div class="card wide hidden" id="screen-play">
    <div class="top-bar">
      <span class="badge" id="qCounter">1 / 10</span>
      <span class="timer" id="stopwatch">00:00</span>
      <span class="badge" id="titleBadge"></span>
    </div>
    <div class="progress-outer"><div class="progress-inner" id="progressBar" style="width:0%"></div></div>

    <div class="host-layout">
      <div class="host-main">
        <div class="qorder" id="qOrderLabel">문제 1</div>
        <div class="question-text" id="questionText"></div>
        <div class="choices" id="choicesBox"></div>
        <div class="grid2" style="margin-top:20px;">
          <button class="btn ghost" id="revealBtn">정답 공개</button>
          <button class="btn" id="nextBtn">다음 문제 ▶</button>
        </div>
      </div>

      <div class="host-side">
        <div class="section-title" style="margin-top:0;">정답자 기록</div>
        <input type="text" id="winnerNameInput" placeholder="정답자 이름 입력" />
        <button class="btn secondary" id="addWinnerBtn">✋ 정답자 등록</button>
        <div class="winners-list" id="winnersForQuestion"></div>
      </div>
    </div>
  </div>

  <!-- 4. 축하 화면 -->
  <div class="card hidden" id="screen-end">
    <div class="celebrate">
      <div class="big-emoji">🎉</div>
      <h1 class="title">축하합니다!</h1>
      <p class="subtitle">퀴즈가 모두 끝났습니다</p>
    </div>
    <div class="section-title">전체 정답자 기록</div>
    <div id="allWinnersList"></div>
    <button class="btn" onclick="location.href='index.html'">처음으로</button>
  </div>

</div>

<script src="js/config.js?v=3"></script>
<script src="js/api.js?v=3"></script>
<script src="js/confetti.js?v=3"></script>
<script src="js/auth.js?v=3"></script>
<script src="js/host.js?v=3"></script>
</body>
</html>
